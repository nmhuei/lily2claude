[package]
name = "lily2claude"
version = "0.1.0"
edition = "2021"
authors = ["light"]
description = "Universal bridge connecting Claude Code CLI to Local Agents (ACP) and Cloud Free Tier (WARP)"

[dependencies]
tokio = { version = "1.35", features = ["full", "process"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "rustls-tls"] }
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
thiserror = "2"
bytes = "1"
regex = "1.11"
tower-http = { version = "0.5", features = ["trace", "cors"] }
async-trait = "0.1.92"

[dev-dependencies]
tokio-test = "0.4"


